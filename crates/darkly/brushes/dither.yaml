name: Dither
description: "An ordered 4x4 Bayer screen pinned to the page. Pressure is the tone: a light touch scatters single pixels, mid pressure lands the checkerboard, and a hard press fills near-solid."
nodes:
  brush_settings:
    type: brush_settings
    inputs:
      size: 0.3
      spacing: 0.08
  circle:
    type: circle
    inputs:
      algorithm: 0
      amplitude: 0.0
      softness: 0.1
  curve:
    type: curve
    inputs:
      curve:
      - - 0.0
        - 0.06
      - - 1.0
        - 1.0
  multiply:
    type: multiply
  multiply_2:
    type: multiply
    inputs:
      b: 0.9
  paint:
    type: paint
    inputs:
      build_flow: 0.9
  paint_color:
    type: paint_color
  pattern:
    type: pattern
    inputs:
      algorithm: 3
      space: 0
      spacing: 4.0
      rotation: 0.0
      softness: 0.15
  pen_input:
    type: pen_input
  stamp:
    type: stamp
connections:
- circle.mask -> multiply.b
- curve.output -> multiply_2.a
- multiply.result -> stamp.tip
- multiply_2.result -> pattern.thickness
- paint_color.color -> stamp.color
- pattern.mask -> multiply.a
- pen_input.position -> paint.position
- pen_input.pressure -> curve.input
- stamp.dab -> paint.rgba
exposed_ports:
  brush_settings.stabilize: {}
  brush_settings.size: {}
  paint.opacity: {}
  pattern.spacing:
    label: Screen
    description: Dither cells per dab radius. One cell is one pixel of the pattern; Size scales the whole screen.
    icon: fa6-solid:grip-lines
  multiply_2.b:
    label: Top Tone
    description: "How dark a full press gets: 100% is a solid fill, 50% tops out at the checkerboard."
    icon: fa6-solid:circle-half-stroke
