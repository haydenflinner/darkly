name: Scanlines
description: "Crisp horizontal lines pinned to the page, like a screen's raster. Pressure sets the line weight against the gap."
nodes:
  brush_settings:
    type: brush_settings
    inputs:
      size: 0.3
      spacing: 0.08
  circle:
    type: circle
    inputs:
      algorithm: 0
      amplitude: 0.0
      softness: 0.1
  curve:
    type: curve
    inputs:
      curve:
      - - 0.0
        - 0.15
      - - 1.0
        - 1.0
  multiply:
    type: multiply
  multiply_2:
    type: multiply
    inputs:
      b: 0.7
  paint:
    type: paint
    inputs:
      build_flow: 0.9
  paint_color:
    type: paint_color
  pattern:
    type: pattern
    inputs:
      algorithm: 0
      space: 0
      spacing: 8.0
      rotation: 0.0
      softness: 0.12
  pen_input:
    type: pen_input
  stamp:
    type: stamp
connections:
- circle.mask -> multiply.b
- curve.output -> multiply_2.a
- multiply.result -> stamp.tip
- multiply_2.result -> pattern.thickness
- paint_color.color -> stamp.color
- pattern.mask -> multiply.a
- pen_input.position -> paint.position
- pen_input.pressure -> curve.input
- stamp.dab -> paint.rgba
exposed_ports:
  brush_settings.stabilize: {}
  brush_settings.size: {}
  paint.opacity: {}
  pattern.spacing:
    label: Pitch
    description: Lines per dab radius. Size scales pitch and weight together; this sets the ratio.
    icon: fa6-solid:grip-lines
  multiply_2.b:
    label: Weight
    description: "Line width as a share of the pitch, before pressure multiplies it. 100% is solid."
    icon: fa6-solid:pen
  pattern.rotation:
    label: Angle
    description: "Line direction: 0 degrees is the raster, 90 is vertical bars."
    icon: fa6-solid:rotate
