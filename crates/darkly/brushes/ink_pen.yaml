name: Ink Pen
description: A round ballpoint — even width that ignores tilt and barely notices pressure. For clean confident lines that hold their weight. (Tilt-expressive graphite lives on Pencil; pressure-bitten ink on Rough Ink.)
nodes:
  brush_settings:
    type: brush_settings
    inputs:
      stabilize: 0.6
  circle:
    type: circle
    inputs:
      softness: 0.1
  curve:
    type: curve
    name: Ballpoint deposit
    comment: Once the tip is writing, ink is nearly full strength — pressure barely changes deposit, and never the width
    inputs:
      curve:
      - - 0.0
        - 0.85
      - - 0.2
        - 0.95
      - - 1.0
        - 1.0
  paint:
    type: paint
  paint_color:
    type: paint_color
  pen_input:
    type: pen_input
  stamp:
    type: stamp
connections:
- circle.mask -> stamp.tip
- paint_color.color -> stamp.color
- pen_input.position -> paint.position
- pen_input.pressure -> curve.input
- curve.output -> paint.build_flow
- stamp.dab -> paint.rgba
exposed_ports:
  brush_settings.stabilize: {}
  brush_settings.size: {}
  circle.softness: {}
  paint.build_flow: {}
  paint.opacity: {}
