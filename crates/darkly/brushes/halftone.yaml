name: Halftone
description: "A comic-book dot screen pinned to the page at 45 degrees. Dot size is the tone: press lightly for a faint sprinkle, hard for a near-solid field."
nodes:
  brush_settings:
    type: brush_settings
    inputs:
      size: 0.3
      spacing: 0.08
  circle:
    type: circle
    inputs:
      algorithm: 0
      amplitude: 0.0
      softness: 0.12
  curve:
    type: curve
    inputs:
      curve:
      - - 0.0
        - 0.15
      - - 1.0
        - 1.0
  multiply:
    type: multiply
  multiply_2:
    type: multiply
    inputs:
      b: 0.8
  paint:
    type: paint
    inputs:
      flow: 0.9
  paint_color:
    type: paint_color
  pattern:
    type: pattern
    inputs:
      algorithm: 1
      space: 0
      spacing: 5.0
      rotation: 0.78539816
      softness: 0.12
  pen_input:
    type: pen_input
  stamp:
    type: stamp
connections:
- circle.mask -> multiply.b
- curve.output -> multiply_2.a
- multiply.result -> stamp.tip
- multiply_2.result -> pattern.thickness
- paint_color.color -> stamp.color
- pattern.mask -> multiply.a
- pen_input.position -> paint.position
- pen_input.pressure -> curve.input
- stamp.dab -> paint.rgba
exposed_ports:
  brush_settings.stabilize: {}
  brush_settings.size: {}
  paint.opacity: {}
  pattern.spacing:
    label: Screen
    description: Dots per dab radius. Size scales the whole screen; this knob sets the dot pitch.
    icon: fa6-solid:grip-lines
  multiply_2.b:
    label: Dot Size
    description: "Largest dot, as a share of the cell; pressure scales it down from here."
    icon: fa6-solid:circle
  pattern.rotation:
    label: Screen Angle
    description: Tilt of the dot grid. 45 degrees is the classic print angle.
    icon: fa6-solid:rotate
