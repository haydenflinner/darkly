name: Checker
description: "A page-fixed checkerboard. Press lightly and only staggered squares land; press through and they grow into the full check."
nodes:
  brush_settings:
    type: brush_settings
    inputs:
      size: 0.3
      spacing: 0.08
  circle:
    type: circle
    inputs:
      algorithm: 0
      amplitude: 0.0
      softness: 0.1
  curve:
    type: curve
    inputs:
      curve:
      - - 0.0
        - 0.3
      - - 1.0
        - 1.0
  multiply:
    type: multiply
  multiply_2:
    type: multiply
    inputs:
      b: 1.0
  paint:
    type: paint
    inputs:
      build_flow: 0.9
  paint_color:
    type: paint_color
  pattern:
    type: pattern
    inputs:
      algorithm: 2
      space: 0
      spacing: 4.0
      rotation: 0.0
      softness: 0.12
  pen_input:
    type: pen_input
  stamp:
    type: stamp
connections:
- circle.mask -> multiply.b
- curve.output -> multiply_2.a
- multiply.result -> stamp.tip
- multiply_2.result -> pattern.thickness
- paint_color.color -> stamp.color
- pattern.mask -> multiply.a
- pen_input.position -> paint.position
- pen_input.pressure -> curve.input
- stamp.dab -> paint.rgba
exposed_ports:
  brush_settings.stabilize: {}
  brush_settings.size: {}
  paint.opacity: {}
  pattern.spacing:
    label: Check
    description: Checker squares per dab radius. Size scales the whole board.
    icon: fa6-solid:grip-lines
  pattern.rotation:
    label: Angle
    description: Board tilt. 45 degrees turns the check into diamonds.
    icon: fa6-solid:rotate
