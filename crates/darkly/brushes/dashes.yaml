name: Dashes
description: "Dashed rows pinned to the page — horizontal lines chopped by a vertical comb. Pressure lengthens the dashes toward solid lines."
nodes:
  brush_settings:
    type: brush_settings
    inputs:
      size: 0.3
      spacing: 0.08
  circle:
    type: circle
    inputs:
      algorithm: 0
      amplitude: 0.0
      softness: 0.1
  curve:
    type: curve
    inputs:
      curve:
      - - 0.0
        - 0.25
      - - 1.0
        - 1.0
  multiply:
    type: multiply
  multiply_2:
    type: multiply
    inputs:
      b: 0.75
  multiply_3:
    type: multiply
  paint:
    type: paint
    inputs:
      build_flow: 0.9
  paint_color:
    type: paint_color
  pattern:
    type: pattern
    inputs:
      algorithm: 0
      space: 0
      spacing: 6.0
      rotation: 0.0
      softness: 0.12
      thickness: 0.4
  pattern_2:
    type: pattern
    inputs:
      algorithm: 0
      space: 0
      spacing: 3.0
      rotation: 1.5707963
      softness: 0.12
  pen_input:
    type: pen_input
  stamp:
    type: stamp
connections:
- circle.mask -> multiply_3.b
- curve.output -> multiply_2.a
- multiply.result -> multiply_3.a
- multiply_2.result -> pattern_2.thickness
- multiply_3.result -> stamp.tip
- paint_color.color -> stamp.color
- pattern.mask -> multiply.a
- pattern_2.mask -> multiply.b
- pen_input.position -> paint.position
- pen_input.pressure -> curve.input
- stamp.dab -> paint.rgba
exposed_ports:
  brush_settings.stabilize: {}
  brush_settings.size: {}
  paint.opacity: {}
  pattern.spacing:
    label: Rows
    description: Dashed rows per dab radius.
    icon: fa6-solid:grip-lines
  pattern_2.spacing:
    label: Dash Pitch
    description: Dashes per dab radius along each row.
    icon: fa6-solid:ruler-horizontal
  pattern.rotation:
    label: Angle
    description: "Row direction: 0 degrees is horizontal; 90 stacks the dashes into columns."
    icon: fa6-solid:rotate
