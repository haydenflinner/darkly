name: Speckle
description: "Random stipple pinned to the page — noise cut to a hard threshold so it lands as single grains. Pressure opens the threshold and the field densifies."
nodes:
  brush_settings:
    type: brush_settings
    inputs:
      size: 0.3
      spacing: 0.08
  add:
    type: add
    inputs:
      b: 0.08
  circle:
    type: circle
    inputs:
      algorithm: 0
      amplitude: 0.0
      softness: 0.1
  curve:
    type: curve
    inputs:
      curve:
      - - 0.0
        - 0.72
      - - 1.0
        - 0.38
  levels:
    type: levels
  multiply:
    type: multiply
  noise:
    type: noise
    inputs:
      space: 0
      scale: 4.0
      octaves: 2.0
      warp: 0.3
      roughness: 0.6
      seed: 7
  paint:
    type: paint
    inputs:
      build_flow: 0.9
  paint_color:
    type: paint_color
  pen_input:
    type: pen_input
  stamp:
    type: stamp
connections:
- add.result -> levels.in_high
- circle.mask -> multiply.b
- curve.output -> add.a
- curve.output -> levels.in_low
- levels.output -> multiply.a
- multiply.result -> stamp.tip
- noise.value -> levels.input
- paint_color.color -> stamp.color
- pen_input.position -> paint.position
- pen_input.pressure -> curve.input
- stamp.dab -> paint.rgba
exposed_ports:
  brush_settings.stabilize: {}
  brush_settings.size: {}
  paint.opacity: {}
  noise.scale:
    label: Grain
    description: Feature size of the speckle, in canvas pixels.
    icon: fa6-solid:grip-lines
  add.b:
    label: Edge
    description: Feather of the threshold, in field units. Lower is a harder grain edge.
    icon: fa6-solid:feather
