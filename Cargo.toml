[workspace]
members = [
    "crates/darkly",
    "crates/darkly-macros",
    "frontend/wasm",
]
default-members = [
    "crates/darkly",
]
resolver = "2"

[workspace.package]
license = "AGPL-3.0-or-later"
# The exact toolchain releases are built with, not a measured minimum. It is
# X.Y.Z because scripts/flathub.sh downloads that toolchain for Flathub; cargo
# enforces it as a floor.
rust-version = "1.98.0"
repository = "https://github.com/darkly-art/darkly"

[workspace.dependencies]
# Local crates. `darkly` is only ever consumed by `darkly-wasm`, which is
# never published, so a bare path is enough. `darkly-macros` ships to crates.io
# as a dependency of `darkly`: publishing strips `path` and substitutes the
# registry version, so a path-only dep would leave the published manifest with
# no version requirement at all. The version here is vestigial in the same way
# the crates' own versions are (see docs/versioning.md); the release workflow
# rewrites all three to the tag being published.
darkly = { path = "crates/darkly", default-features = false }
darkly-macros = { path = "crates/darkly-macros", version = "0.1.0" }

# Proc-macro toolchain (the `#[handlers]` engine-bridge macro + build.rs scan)
syn = { version = "3", features = ["full", "visit"] }
quote = "1"
proc-macro2 = "1"

# GPU
wgpu = { version = "30.0", features = ["webgpu"] }

# Vector / text: the Vello family shares one geometry/style vocabulary
# (kurbo/peniko), so the renderer is a swappable backend behind one data model.
# vello_gpu renders into the same wgpu device as the compositor; it must come
# from this fork rev — graphite's `[patch.crates-io]` pulls the identical rev
# for its fixes (crates.io 0.3 lacks them, 0.4 moved the render() API). Keep
# the rev and the wgpu major bumped together.
vello_gpu = { git = "https://github.com/haydenflinner/vello.git", rev = "4df331db2a02cb0f1cef4a0190dbbb2a00f4b075", default-features = false, features = ["wgpu", "text", "full_image_support", "blurred_rounded_rect"] }
# vello_gpu's text path takes `glifo::Glyph` (the crate that owns glyph-run
# rendering); it isn't re-exported, so the dep is named directly.
glifo = { git = "https://github.com/haydenflinner/vello.git", rev = "4df331db2a02cb0f1cef4a0190dbbb2a00f4b075" }
kurbo = { version = "0.13", features = ["serde"] }
peniko = { version = "0.6", features = ["serde"] }
parley = "0.12"

# Graphene facade: Graphite's vector/type libraries and its `rendering` crate
# (Graphic → VelloSceneBuilder → vello_gpu::Scene + SceneImage table), compiled
# into this wasm so prims never serialize. Pinned to our fork's
# `dsa/graphene-darkly` branch — Graphite HEAD 47cc1c4 plus dep trims
# (dyn-any/reqwest off, image codecs to png+jpeg, wgpu strict_asserts off).
# `rendering` pulls text-nodes/brush-types/graphene-resource transitively; only
# the listed crates are named directly.
# (default-features must stay on: `rendering` derives serde unconditionally
# at renderer.rs RenderParams — the feature flag is a lie upstream.)
core-types = { git = "https://github.com/haydenflinner/Graphite", rev = "b88857fda1ddc06d9ac64cd17a85d2fc477f78e3" }
vector-types = { git = "https://github.com/haydenflinner/Graphite", rev = "b88857fda1ddc06d9ac64cd17a85d2fc477f78e3" }
graphic-types = { git = "https://github.com/haydenflinner/Graphite", rev = "b88857fda1ddc06d9ac64cd17a85d2fc477f78e3" }
rendering = { git = "https://github.com/haydenflinner/Graphite", rev = "b88857fda1ddc06d9ac64cd17a85d2fc477f78e3" }
path-bool-nodes = { git = "https://github.com/haydenflinner/Graphite", rev = "b88857fda1ddc06d9ac64cd17a85d2fc477f78e3" }
glam = { version = "0.34", default-features = false, features = ["std", "scalar-math", "all-types"] }

# Data
bytemuck = { version = "1.13", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# Typed-bridge TS codegen only (the `ts-export` feature on `darkly`); never
# compiled into the wasm/production build: see that feature's comment.
ts-rs = { version = "12", features = ["serde-json-impl"] }
# serde_yaml_ng, not serde_yml: the original `serde_yaml` (dtolnay) is archived,
# and the `serde_yml` fork is unmaintained: its 0.0.13 release swapped to a
# `noyalib` backend that can't round-trip integer-keyed maps (`BTreeMap<u64,_>`),
# which silently breaks the brush portable format. serde_yaml_ng is the faithful
# maintained fork and a drop-in for the original serde_yaml API.
serde_yaml_ng = "0.10"
log = "0.4"
zip = { version = "8.6", default-features = false, features = ["deflate"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
png = "0.18"
quick-xml = "0.42"
base64 = "0.23"
thiserror = "2.0"
# `serde` feature intentionally off: slotmap's derived key serde encodes the
# generational key as a `{ idx, version }` struct, but `LayerId` crosses the
# wire as a single packed `u64` (see its hand-written serde impl in `layer.rs`).
# The two would conflict, and nothing serializes a `SlotMap` directly.
slotmap = { version = "1.0" }
smallvec = "1"

# WASM
wasm-bindgen = "=0.2.114"
wasm-bindgen-futures = "0.4"
serde-wasm-bindgen = "0.6"
js-sys = "=0.3.91"
web-sys = { version = "=0.3.91", features = [
    "HtmlCanvasElement",
    "HtmlVideoElement",
    "Window",
    "Navigator",
    "Gpu",
    "OffscreenCanvas",
    "ImageBitmap",
    "console",
] }
web-time = "1.1.0"
console_error_panic_hook = "0.1"
console_log = "1"

# Full DWARF on every statically-linked test binary is what let `target/` balloon
# to hundreds of GB (each integration test links the whole engine (~300 MB apiece),
# and Cargo never GCs stale fingerprints). Line tables keep panics/backtraces useful
# while cutting each binary well over half; unpacked split-debuginfo keeps the debug
# data in separate object files out of the linked executables.

# S9 spline fork: knot-interpolating `Spline`/`solve_spline` on kurbo types.
[patch.crates-io]
kurbo = { path = "../../kurbo/kurbo" }
# The graphene crates dep `vello_gpu = "0.3"` from crates.io; patch the whole
# family onto the same fork rev darkly deps directly, or two `vello_gpu`
# sources compile and `Scene`/`Resources` don't unify. `vello_common` and
# `vello_gpu_shaders` ride the same patch for the same reason (graphite's own
# [patch] doesn't apply here — patches only hold at the build's workspace
# root). Same URL and rev as the direct dep above.
vello_gpu = { git = "https://github.com/haydenflinner/vello.git", rev = "4df331db2a02cb0f1cef4a0190dbbb2a00f4b075" }
vello_common = { git = "https://github.com/haydenflinner/vello.git", rev = "4df331db2a02cb0f1cef4a0190dbbb2a00f4b075" }
vello_gpu_shaders = { git = "https://github.com/haydenflinner/vello.git", rev = "4df331db2a02cb0f1cef4a0190dbbb2a00f4b075" }
# graphene's `rendering` touches usvg only in two never-called SVG helpers;
# the stub keeps fontdb/rustybuzz/resvg out of the wasm (see stubs/usvg).
usvg = { path = "stubs/usvg" }

[profile.dev]
opt-level = 1
debug = "line-tables-only"
split-debuginfo = "unpacked"

[profile.release]
lto = "thin"
codegen-units = 1

[workspace.lints.clippy]
too_many_arguments = "allow"
